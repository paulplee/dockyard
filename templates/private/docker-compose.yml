# =============================================================================
# dockyard / private — Docker Compose
# Generic scaffold for deploying a closed-source private application.
# All instance-specific values come from .env (at VOLUMES_BASE).
# =============================================================================
name: private

services:
  private:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_USER: "${AGENT_USER}"
        AGENT_UID: "${AGENT_UID}"
        NEOVIM_VERSION: "0.12.1"
        SSH_PORT: "22"
        PRIVATE_APP_VERSION: "${PRIVATE_APP_VERSION:-main}"
        PRIVATE_APP_PORT: "${PRIVATE_APP_PORT:-7700}"
    container_name: dy-${CONTAINER_NAME}
    hostname: ${CONTAINER_NAME}
    restart: unless-stopped
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
      - /tmp:exec
    ports:
      - "127.0.0.1:${SSH_PORT}:22"
      - "127.0.0.1:${PRIVATE_APP_PORT:-7700}:7700"
    volumes:
      - ${VOLUMES_BASE}/${CONTAINER_NAME}-data:/home/${AGENT_USER}/.${CONTAINER_NAME}
      - ${VOLUMES_BASE}/config:/home/${AGENT_USER}/.config
      - ${VOLUMES_BASE}/nvim-data:/home/${AGENT_USER}/.local/share/nvim
      - ${VOLUMES_BASE}/nvim-state:/home/${AGENT_USER}/.local/state/nvim
      - ${VOLUMES_BASE}/workspace:/workspace
      - ${VOLUMES_BASE}/ssh:/home/${AGENT_USER}/.ssh
      - ${VOLUMES_BASE}/secrets:/secrets:ro
      - ${VOLUMES_BASE}/logs:/logs
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      CONTAINER_NAME: "${CONTAINER_NAME}"
      AGENT_USER: "${AGENT_USER}"
    dns:
      - "${DNS_SERVER:-10.10.1.2}"
      - "1.1.1.1"
    extra_hosts:
      - "host.gateway.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16G
        reservations:
          cpus: "0.5"
          memory: 512M
