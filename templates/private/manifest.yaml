# =============================================================================
# dockyard / private — Closed-source private application scaffold
# Generic scaffold for deploying a closed-source application inside a
# dockyard-managed container. Ships no proprietary code.
# =============================================================================
name: private
description: "Generic scaffold for deploying a closed-source private application"

# Directories created under $VOLUMES_BASE; first group is owned by the agent
# user (mode 2770), second group stays root-owned.
agent_dirs:
  - config
  - nvim-data
  - nvim-state
  - workspace
  - logs
root_dirs:
  - ssh
  - secrets

# Files copied from the shared/ tree into the build staging directory before
# `docker compose build` runs. Paths are relative to the repo root.
shared_files:
  - src: shared/entrypoint.sh
    dst: entrypoint.sh
  - src: shared/boot-seed.sh
    dst: boot-seed.sh

build_args:
  - name: PRIVATE_APP_VERSION
    prompt: "Private app version (git ref, tag, or release version)"
    default: "main"
  - name: PRIVATE_APP_PORT
    prompt: "Host port for the private app service"
    default: "7700"
  - name: DNS_SERVER
    prompt: "Primary DNS server (LAN resolver)"
    default: "10.10.1.2"

host_files:
  - src: env.example
    dst: secrets/env.example
