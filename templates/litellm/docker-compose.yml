# =============================================================================
# dockyard / litellm — Docker Compose
# LiteLLM proxy gateway — OpenAI-compatible API that routes to upstream
# providers (OpenAI, Anthropic, Gemini, …) from a VPS, masking the caller's
# origin location.
# All instance-specific values come from .env (at VOLUMES_BASE).
# =============================================================================
name: litellm

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: dy-${CONTAINER_NAME}
    hostname: ${CONTAINER_NAME}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      # Proxy config — copy proxy_config.yaml.example → config/proxy_config.yaml
      # and edit before first deploy.
      - ${VOLUMES_BASE}/config/proxy_config.yaml:/app/config.yaml:ro
      # Data dir — unused in stateless mode; kept for future Postgres migration.
      - ${VOLUMES_BASE}/data:/app/data
    environment:
      CONTAINER_NAME: "${CONTAINER_NAME}"
    # LITELLM_MASTER_KEY and all provider API keys come from secrets/env so
    # they are never substituted from the host shell (which would blank them).
    env_file:
      - ${VOLUMES_BASE}/secrets/env
    dns:
      - "${DNS_SERVER:-1.1.1.1}"
      - "8.8.8.8"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
